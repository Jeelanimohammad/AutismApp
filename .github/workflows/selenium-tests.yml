name: Selenium E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run Selenium Web E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install WEB dependencies
        run: |
          cd WEB
          npm ci

      - name: Start Vite Application Server
        run: |
          cd WEB
          npm run dev &
          npx wait-on http://localhost:5174 --timeout 30000

      - name: Run Selenium E2E Tests
        env:
          HEADLESS: 'true'
          CI: 'true'
        run: |
          cd WEB
          npm run test:e2e

      - name: Generate Job Summary & Report
        if: always()
        run: |
          echo "## 🧪 Selenium E2E Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "WEB/tests_report.csv" ]; then
            echo "### 📊 Test Results Overview" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Category | Test Case Title | Action / Details |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            tail -n +2 WEB/tests_report.csv | while IFS=',' read -r category title status action; do
              # Clean quotes
              category=$(echo "$category" | sed 's/"//g')
              title=$(echo "$title" | sed 's/"//g')
              status=$(echo "$status" | sed 's/"//g')
              action=$(echo "$action" | sed 's/"//g')
              
              if [ "$status" = "PASSED" ]; then
                badge="✅ **PASSED**"
              else
                badge="❌ **FAILED**"
              fi
              
              echo "| $badge | $category | $title | $action |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ `tests_report.csv` file not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Report CSV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: WEB/tests_report.csv
          if-no-files-found: ignore
