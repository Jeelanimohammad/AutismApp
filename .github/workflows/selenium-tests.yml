name: Integrated Testing Suite (E2E, Unit, Load, Security, Validation, Mobile)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrated-tests:
    name: Run Integrated Verification Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install WEB dependencies
        run: |
          cd WEB
          npm ci

      - name: Start Vite Application Server
        run: |
          cd WEB
          npm run dev &
          npx wait-on http://localhost:5174 --timeout 30000

      - name: Run Integrated Verification Suites
        env:
          HEADLESS: 'true'
          CI: 'true'
        run: |
          cd WEB
          npm run test:all || true

      - name: Generate Job Summary & Pass Percentage Report
        if: always()
        run: |
          cd WEB
          node tests/helpers/generateSummary.cjs

      - name: Upload Test Artifacts (CSV & JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-test-reports
          path: |
            WEB/tests_report.csv
            WEB/tests_summary.json
          if-no-files-found: ignore
